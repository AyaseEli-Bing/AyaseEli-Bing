name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # 每天午夜运行
  workflow_dispatch: # 允许手动触发
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: platane/snake@master
        with:
          github_user_name: ${{ github.repository_owner }}
          color_snake: "#D4A017"
          color_dots: "#555555,#238636,#D4A017"
          output: "output/github-contribution-grid-snake.svg"

      - name: Generate dark mode snake animation
        uses: platane/snake@master
        with:
          github_user_name: ${{ github.repository_owner }}
          color_snake: "#D4A017"
          color_dots: "#555555,#238636,#D4A017"
          background_color: "#0d1117"
          output: "output/github-contribution-grid-snake-dark.svg"

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update contribution snake animation [skip ci]"
            git push
          fi
